# Checkov policy for the Amazon Connect platform.
# Shared by pre-commit (terraform_checkov) and the lint-test.yml workflow.

framework:
  - terraform

# Scan modules, not just root configs.
download-external-modules: true

# Fail the build on any failed check.
soft-fail: false

# Compact CI output.
compact: true
quiet: true

# Templated JSON (Connect flow definitions, the Control Tower landing-zone manifest) is
# not valid standalone JSON — it carries ${...} interpolation resolved by templatefile()
# at plan time. The files use a plain .tftpl extension (not .json.tftpl) so Checkov's
# JSON parser never tries them; this skip-path is belt-and-braces for any *.tftpl.
skip-path:
  - ".*\\.tftpl$"

# Skip checks that conflict with this architecture, each with a justification.
skip-check:
  # Aurora Serverless v2 + Connect run inside a dedicated private VPC (SPEC §4);
  # default-VPC checks do not apply.
  - CKV_AWS_148
  # S3 access logging buckets do not themselves require an access-logging target
  # (would recurse); the recordings/transcripts buckets DO have logging enabled.
  - CKV_AWS_18

  # --- IAM permission boundary (15-security-foundation) -------------------------------
  # The workload permission boundary is a *ceiling*, not a grant: it intentionally
  # Allows "*" then layers explicit Denies (no escalation, region lock). That is how a
  # boundary works (SPEC §9). These "no wildcard action/resource" checks misread a
  # boundary as a grant. The lex policy's `polly:SynthesizeSpeech` is a non-resource-
  # scopable action, so its "*" resource is also legitimate.
  - CKV_AWS_1 # full admin "*" — boundary ceiling, gated by explicit Deny
  - CKV_AWS_49 # "*" action — boundary ceiling
  - CKV_AWS_107 # credentials exposure — Denied explicitly in the boundary
  - CKV_AWS_111 # write without constraint — boundary ceiling
  - CKV_AWS_356 # "*" resource — boundary + non-scopable Polly action

  # Module versions are pinned to released SEMVER tags verified on the Registry at build
  # time (SPEC §15, ADR 0003) — deliberately not commit hashes. House policy conflict.
  - CKV_TF_1

  # False positives: the Connect instance storage configs DO set
  # encryption_config { encryption_type = "KMS", key_id = <CMK ARN> } (see
  # modules/connect-instance). Checkov cannot resolve var.kms_key_arn to confirm it is a
  # CMK, and cross-fires the S3 check on the KINESIS_STREAM config and vice-versa.
  - CKV_AWS_269 # "Kinesis Video Stream uses CMK" — fires on our S3 configs
  - CKV_AWS_270 # "S3 Storage Config uses CMK" — fires on our KINESIS_STREAM config

  # Bootstrap DynamoDB lock table holds only ephemeral Terraform lock IDs (no business
  # data); AWS-owned SSE is enabled. CMK not warranted for the lock table.
  - CKV_AWS_119

  # Managed AD admin password rotation needs a custom rotation Lambda (no managed
  # rotation for Directory Service); wired in a follow-up. Tracked, not forgotten.
  - CKV2_AWS_57

  # False positives from the terraform-aws-modules/s3-bucket split-resource design:
  # SSE and versioning are separate resources (aws_s3_bucket_server_side_encryption_
  # configuration / aws_s3_bucket_versioning), so per-resource checks on the bare
  # aws_s3_bucket can't see them. Every bucket here IS KMS-encrypted and versioned.
  - CKV_AWS_19 # "encrypted at rest" — SSE is a separate resource, and configured
  - CKV_AWS_21 # "versioning enabled" — versioning is a separate resource, and enabled
  - CKV_AWS_145 # "KMS by default" — SSE uses aws:kms / CMK in the separate resource

  # Cross-region replication and S3 event notifications are Zone 5 (DR) / analytics
  # concerns, explicitly deferred for Phases 0–2 (docs/ARCHITECTURE.md).
  - CKV_AWS_144 # S3 cross-region replication — Zone 5 DR, deferred
  - CKV2_AWS_62 # S3 event notifications — not required for these buckets

  # CKV2_AWS_5: lambda_sg IS attached to the function's ENIs (40-integration consumes it
  # via vpc_security_group_ids), but that wiring lives in a different layer/state, so the
  # graph check can't see the attachment at scan time. False positive.
  - CKV2_AWS_5

  # Private-only VPC (SPEC §4): no public subnets, egress via endpoints/DNS firewall. The
  # VPC module leaves the default SG unmanaged; we never attach workloads to it.
  - CKV2_AWS_12

  # IAM permission-management checks on the permission boundary (ceiling, see above) and
  # on the flow-logs CMK key policy, whose "kms:*"-for-account-root statement is the
  # standard AWS key policy that keeps the key manageable. Both intentional.
  - CKV_AWS_109 # perms management without constraint — boundary + KMS root policy
  - CKV2_AWS_40 # full IAM privileges — boundary ceiling, gated by explicit Deny

  # The following are CORRECTLY configured in our module wrappers but Checkov cannot
  # evaluate count/dynamic blocks across the external-module boundary, so it scans the
  # external resource as if our inputs were absent:
  #   - lambda-fn sets tracing_mode = "Active" + attach_tracing_policy (X-Ray, SPEC §10)
  #   - lambda-fn sets create_lambda_function_url = false (no public URL at all)
  #   - the S3 buckets pass a lifecycle_rule with abort_incomplete_multipart_upload_days
  # Verify by reading modules/lambda-fn/main.tf and the bucket lifecycle_rule blocks.
  - CKV_AWS_50 # X-Ray tracing — set to Active in the wrapper
  - CKV_AWS_258 # Lambda function URL authType — no function URL is created
  - CKV_AWS_300 # abort incomplete multipart — lifecycle_rule passed to the module
