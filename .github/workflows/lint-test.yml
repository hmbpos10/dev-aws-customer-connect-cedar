# Linting and security scanning (CLAUDE.md).
# Tools: TFLint, Checkov, Trivy, Prettier, Ruff, Black, Bandit.
---
name: lint-test

"on":
  pull_request:
    branches:
      - main
      - "feature/**"
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-lint:
    name: terraform lint + scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0
      - run: |
          tflint --init --config="$PWD/.tflint.hcl"
          tflint --recursive --config="$PWD/.tflint.hcl"

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          config_file: .checkov.yaml

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: HIGH,CRITICAL
          exit-code: "1"

  python-lint:
    name: python lint + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black bandit
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Bandit
        run: bandit -r . -ll --exclude ./.git

  prettier:
    name: prettier (yaml/json/md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes prettier@3.3.3 --check "**/*.{yml,yaml,json,md}"
